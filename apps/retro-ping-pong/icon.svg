<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <rect width="64" height="64" rx="14" fill="#000000"/>
  <rect x="4" y="4" width="56" height="56" rx="10" fill="#000000" stroke="rgba(255,255,255,0.6)" stroke-width="1.5"/>
  <!-- net -->
  <line x1="32" y1="10" x2="32" y2="54" stroke="#ffffff" stroke-width="2" stroke-dasharray="4 4" opacity="0.6"/>
  <!-- left paddle -->
  <rect x="10" y="22" width="4" height="20" fill="#ffffff" rx="2"/>
  <!-- right paddle -->
  <rect x="50" y="22" width="4" height="20" fill="#ffffff" rx="2"/>
  <!-- ball -->
  <circle cx="32" cy="32" r="4" fill="#ffffff"/>
  <!-- scores -->
  <text x="16" y="14" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">0</text>
  <text x="48" y="14" font-family="monospace" font-size="11" fill="#ffffff" text-anchor="middle">0</text>
</svg>
