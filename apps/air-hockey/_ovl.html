<div id="ready-screen" class="screen on">
  <div class="ready-inner">
    <div class="ready-face">??</div>
    <div class="ready-title">AIR HOCKEY</div>
    <div class="ready-sub">FIRST TO 7 WINS</div>
    <div id="best-pill" class="ready-pill">BEST · 0</div>
    <div id="ready-diff" class="pace ready-diff">
      <button type="button" data-diff="easy">Easy</button>
      <button type="button" data-diff="normal" class="active">Normal</button>
      <button type="button" data-diff="hard">Hard</button>
    </div>
    <button id="btn-play" class="ready-play">PLAY</button>
    <div class="ready-keys">MOUSE / TOUCH · WASD · SPACE PAUSE · M MUTE</div>
  </div>
</div>
<div id="pause-screen" class="screen">
  <div class="pause-inner">
    <div class="ready-title" style="color:#ffc940">PAUSED</div>
    <div id="pause-msg" class="ready-sub" style="letter-spacing:3px;margin:6px 0 20px"></div>
    <button id="btn-resume" class="ready-play" style="border-color:#ffc940;color:#ffc940">RESUME</button>
  </div>
</div>
