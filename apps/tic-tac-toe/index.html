<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tic Tac Toe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="app__header">
      <div class="mode-switch" role="group" aria-label="Modo de jogo">
        <button type="button" class="mode-btn" data-mode="2p" aria-pressed="true">2 Jogadores</button>
        <button type="button" class="mode-btn" data-mode="1p" aria-pressed="false">1 Jogador</button>
      </div>
    </header>

    <section class="scores" aria-label="Pontuações">
      <div class="score">
        <span class="score__label">X</span>
        <span class="score__value" id="score-x">0</span>
      </div>
      <div class="score">
        <span class="score__label">Empates</span>
        <span class="score__value" id="score-draw">0</span>
      </div>
      <div class="score">
        <span class="score__label">O</span>
        <span class="score__value" id="score-o">0</span>
      </div>
    </section>

    <div class="turn" aria-live="polite">
      <span id="turn-text"></span>
    </div>

    <div class="board" id="board" role="group" aria-label="Tabuleiro">
      <button type="button" class="cell" data-index="0" aria-label="Casa 1"></button>
      <button type="button" class="cell" data-index="1" aria-label="Casa 2"></button>
      <button type="button" class="cell" data-index="2" aria-label="Casa 3"></button>
      <button type="button" class="cell" data-index="3" aria-label="Casa 4"></button>
      <button type="button" class="cell" data-index="4" aria-label="Casa 5"></button>
      <button type="button" class="cell" data-index="5" aria-label="Casa 6"></button>
      <button type="button" class="cell" data-index="6" aria-label="Casa 7"></button>
      <button type="button" class="cell" data-index="7" aria-label="Casa 8"></button>
      <button type="button" class="cell" data-index="8" aria-label="Casa 9"></button>
    </div>

    <div class="status" id="status" role="status" aria-live="polite"></div>

    <footer class="actions">
      <button type="button" class="btn btn--primary" id="new-round">Nova ronda</button>
      <button type="button" class="btn btn--danger" id="reset-scores">Reiniciar pontuações</button>
    </footer>
  </main>

  <script src="../../system/sdk/os-sdk.js"></script>
  <script src="../../system/sdk/os-dialogs.js"></script>
  <script src="app.js"></script>
</body>
</html>
