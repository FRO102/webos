<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rádio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="header-area">
      <header class="search-bar">
        <input type="search" id="search-input" placeholder="Pesquisar estações…" aria-label="Pesquisar estações">
        <select id="country-filter" aria-label="Filtrar por país">
          <option value="">Todos os países</option>
        </select>
        <select id="tag-filter" aria-label="Filtrar por género">
          <option value="">Todos os géneros</option>
        </select>
        <select id="sort-filter" aria-label="Ordenar por">
          <option value="clickcount">Mais Ouvidas</option>
          <option value="votes">Mais Votadas</option>
          <option value="bitrate">Maior Bitrate</option>
          <option value="random">Aleatório</option>
        </select>
      </header>

      <div class="tabs" role="tablist" aria-label="Secções">
        <button type="button" role="tab" data-tab="search" aria-selected="true">Pesquisar</button>
        <button type="button" role="tab" data-tab="favorites" aria-selected="false">Favoritos</button>
        <button type="button" role="tab" data-tab="history" aria-selected="false">Histórico</button>
      </div>
    </div>

    <div class="list-container">
      <div class="station-list" id="station-list" role="list"></div>
      <div class="list-actions">
        <button type="button" class="btn-secondary" id="btn-export" hidden>Exportar Favoritos</button>
        <button type="button" class="btn-secondary" id="btn-import" hidden>Importar Favoritos</button>
        <button type="button" class="btn-primary" id="btn-load-more" hidden>Carregar Mais</button>
      </div>
    </div>

    <footer class="player" id="player">
      <div class="player-info">
        <div class="visualizer" id="visualizer" aria-hidden="true">
          <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <img id="player-favicon" src="" alt="" width="40" height="40" class="player-favicon" hidden>
        <div class="player-text">
          <div class="player-name" id="player-name">Nenhuma estação</div>
          <div class="player-meta" id="player-meta">Selecione uma estação para ouvir</div>
        </div>
      </div>
      <div class="player-controls">
        <select id="sleep-timer" aria-label="Temporizador de sono" title="Sleep Timer">
          <option value="0">Sleep: Off</option>
          <option value="15">15 min</option>
          <option value="30">30 min</option>
          <option value="60">60 min</option>
        </select>
        <button type="button" class="ctrl-btn" id="btn-stop" aria-label="Parar" disabled>
          <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="1"/></svg>
        </button>
        <button type="button" class="ctrl-btn" id="play-pause" aria-label="Reproduzir" disabled>
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><polygon points="8,5 19,12 8,19"/></svg>
        </button>
        <input type="range" id="volume" min="0" max="1" step="0.01" value="0.7" aria-label="Volume">
        <span class="volume-label" id="volume-label">70%</span>
      </div>
      <audio id="audio" preload="none"></audio>
    </footer>
  </div>

  <script src="../../system/sdk/os-sdk.js"></script>
  <script src="../../system/sdk/os-dialogs.js"></script>
  <script src="app.js"></script>
</body>
</html>
