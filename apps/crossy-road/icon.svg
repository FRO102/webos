  <rect width="64" height="64" rx="12" fill="#5dc7e7"/>
  <rect x="4" y="40" width="56" height="20" rx="6" fill="#6b6b6b"/>
  <line x1="4" y1="50" x2="20" y2="50" stroke="#fef6d8" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="26" y1="50" x2="42" y2="50" stroke="#fef6d8" stroke-width="2" stroke-dasharray="6 4"/>
  <line x1="48" y1="50" x2="60" y2="50" stroke="#fef6d8" stroke-width="2" stroke-dasharray="6 4"/>
  <!-- chicken -->
  <circle cx="32" cy="30" r="10" fill="#fff" stroke="#333" stroke-width="1"/>
