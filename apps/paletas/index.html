<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Paleta de Cores</title><link rel="stylesheet" href="style.css">
</head>
<body>
  <header><div class="heading"><span>ESTÚDIO DE COR</span><h1>Paleta de cores</h1></div><div id="preview" aria-label="Pré-visualização da cor"><span id="preview-label">Cor selecionada</span><button id="copy-hex" title="Copiar HEX" aria-label="Copiar código HEX">Copiar</button></div></header>
  <main>
    <section class="picker-row"><label class="picker"><input id="color-picker" type="color" value="#267568" aria-label="Escolher cor"><span>Escolher cor</span></label><label class="hex-field">HEX<input id="hex" value="#267568" maxlength="7" spellcheck="false" autocomplete="off"></label><button id="random" title="Gerar cor aleatória">Aleatória</button></section>
    <section class="channels" aria-label="Canais de cor">
      <div><h2>RGB</h2><label>R<input id="red" type="number" min="0" max="255"></label><label>G<input id="green" type="number" min="0" max="255"></label><label>B<input id="blue" type="number" min="0" max="255"></label></div>
      <div><h2>HSL</h2><label>H<input id="hue" type="number" min="0" max="360"></label><label>S<input id="saturation" type="number" min="0" max="100"></label><label>L<input id="lightness" type="number" min="0" max="100"></label></div>
    </section>
    <section class="contrast-section"><div class="section-title"><div><p class="eyebrow">ACESSIBILIDADE</p><h2>Contraste WCAG</h2></div><span>Texto sobre branco e preto</span></div><div class="contrast-cards"><article id="on-white"><div>Aa</div><strong id="white-ratio">0:1</strong><span id="white-grade"></span></article><article id="on-black"><div>Aa</div><strong id="black-ratio">0:1</strong><span id="black-grade"></span></article></div></section>
    <section class="collection"><div class="section-title"><div><p class="eyebrow">BIBLIOTECA</p><h2>Coleções</h2></div><button id="new-collection">+ Coleção</button></div><div class="collection-tools"><select id="collection-select" aria-label="Coleção atual"></select><button id="add-color">Guardar cor atual</button><button id="rename-collection" aria-label="Renomear coleção" title="Renomear coleção">Renomear</button><button id="delete-collection" aria-label="Apagar coleção" title="Apagar coleção">Apagar</button></div><div id="swatches" class="swatches"></div><p id="empty-swatches">Esta coleção ainda não tem cores.</p></section>
  </main>
  <footer><span id="status" role="status" aria-live="polite"></span><span>O contraste segue os rácios WCAG 2.1.</span></footer>
  <script src="../../system/sdk/os-sdk.js"></script><script src="../../system/sdk/os-dialogs.js"></script><script src="app.js"></script>
</body>
</html>
