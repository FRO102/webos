<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Definições</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header class="app-header"><h1>Definições do sistema</h1><p>Personaliza a aparência do teu WebOS.</p></header>
    <div class="settings-container">
      <section class="card" aria-labelledby="theme-title"><div class="card-header"><span class="icon" aria-hidden="true">◐</span><h2 id="theme-title">Tema</h2></div><div class="theme-selector" role="radiogroup" aria-label="Tema do sistema"><label class="theme-btn"><input type="radio" name="theme" value="light"><span aria-hidden="true">☀</span><span>Claro</span></label><label class="theme-btn"><input type="radio" name="theme" value="dark"><span aria-hidden="true">☾</span><span>Escuro</span></label></div></section>
      <section class="card" aria-labelledby="accent-title"><div class="card-header"><span class="icon" aria-hidden="true">●</span><h2 id="accent-title">Cor de destaque</h2></div><div id="accents" class="swatch-grid" role="group" aria-label="Cores de destaque"></div><label class="custom-color-box" for="custom"><span>Cor personalizada</span><input type="color" id="custom"></label></section>
      <section class="card" aria-labelledby="wall-title"><div class="card-header"><span class="icon" aria-hidden="true">▧</span><h2 id="wall-title">Papel de parede</h2></div><div id="walls" class="wall-grid" role="group" aria-label="Papéis de parede"></div></section>
      <section class="card" aria-labelledby="system-title"><div class="card-header"><span class="icon" aria-hidden="true">⚙</span><h2 id="system-title">Sistema</h2></div><div class="action-row"><button id="test" class="action-btn">Enviar notificação de teste</button><button id="reset" class="action-btn ghost">Repor predefinições</button></div><p id="status" class="status" role="status" aria-live="polite"></p></section>
      <section class="card" aria-labelledby="display-title"><div class="card-header"><span class="icon" aria-hidden="true">⛶</span><h2 id="display-title">Ecrã</h2></div><div class="action-row"><button id="fullscreen" class="action-btn">Ativar ecrã inteiro</button></div><p id="fullscreen-status" class="status" role="status" aria-live="polite"></p></section>
      <section class="card" aria-labelledby="access-title"><div class="card-header"><span class="icon" aria-hidden="true">Aa</span><h2 id="access-title">Acessibilidade</h2></div><label class="setting-row" for="font-size"><span>Tamanho do texto <strong id="font-size-value">14px</strong></span><input id="font-size" type="range" min="12" max="20" step="1"></label><label class="setting-row"><span>Animações</span><input id="animations" type="checkbox"></label><label class="setting-row"><span>Sons</span><input id="sounds" type="checkbox"></label><label class="setting-row" for="language"><span>Idioma</span><select id="language"><option value="pt-PT">Português (Portugal)</option><option value="en">English (UK)</option></select><small id="language-status" aria-live="polite"></small></label></section>
    </div>
  </main>
  <script src="../../system/sdk/os-sdk.js"></script><script src="app.js"></script>
</body>
</html>
