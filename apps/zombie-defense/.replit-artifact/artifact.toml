kind = "web"
previewPath = "/"
title = "Zona Morta: Defesa"
description = "Um jogo 2D de tower defense em que o jogador protege sobreviventes contra hordas de zumbis em mapas distintos, escolhe a dificuldade, posiciona torres e combate diretamente com um personagem controlável."
version = "1.0.0"
id = "artifacts/zombie-defense"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 18978

[services.development]
run = "pnpm --filter @workspace/zombie-defense run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/zombie-defense", "run", "build" ]
serve = "static"
publicDir = "artifacts/zombie-defense/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "18978"
BASE_PATH = "/"
