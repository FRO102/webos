<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="UTF-8">
  <title>Feed de Notícias</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <div class="header-group">
      <select id="source-select">
        <option value="hn">Hacker News</option>
        <option value="devto">Dev.to</option>
      </select>
      <button id="remove-rss-btn" type="button" title="Remover o feed RSS selecionado" style="display:none;">Remover RSS</button>
      <select id="sort-select">
        <option value="score">Ordenar: Pontuação</option>
        <option value="date">Ordenar: Mais Recentes</option>
      </select>
    </div>
    <div class="header-group">
      <input type="text" id="search-input" placeholder="Pesquisar...">
      <button id="settings-btn" title="Definições de Leitura">⚙️</button>
      <button id="refresh-btn" title="Atualizar">🔄</button>
    </div>
  </div>
  <form id="rss-feed-form" class="rss-feed-form">
    <label for="rss-feed-url">Adicionar feed RSS ou Atom</label>
    <input id="rss-feed-url" type="url" placeholder="https://exemplo.com/feed.xml" required>
    <button type="submit">Adicionar feed</button>
    <span>Feeds que bloqueiam pedidos do browser por CORS não podem ser lidos diretamente.</span>
  </form>
  <div class="tag-bar" id="tag-bar" style="display:none;">
    <!-- Tags dinâmicas aqui -->
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="feed">Feed</button>
    <button class="tab-btn" data-tab="saved">Favoritos (⭐)</button>
    <button class="tab-btn" data-tab="history">Histórico</button>
  </div>
  <div class="content" id="news-container">
    <p style="color: var(--os-muted); text-align: center; margin-top: 20px;">A carregar notícias...</p>
  </div>
  <div id="load-more-container" style="padding: 10px; text-align: center; display: none;">
    <button id="load-more-btn">Carregar Mais</button>
  </div>

  <!-- Janela Modal para Comentários / Definições -->
  <div id="modal-overlay" class="modal-overlay" style="display: none;">
    <div class="modal-box" id="modal-box">
      <div class="modal-header">
        <h3 id="modal-title">Título</h3>
        <button id="modal-close">✕</button>
      </div>
      <div class="modal-body" id="modal-body">
        <!-- Conteúdo dinâmico -->
      </div>
    </div>
  </div>

  <script src="../../system/sdk/os-sdk.js"></script>
  <script src="app.js"></script>
</body>
</html>
