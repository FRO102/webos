name: Validate WebOS

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate manifests
        run: node tests/validate-manifests.mjs
      - name: Smoke test
        run: node tests/smoke.mjs
      - name: Filesystem path tests
        run: node tests/filesystem-paths.mjs
      - name: Filesystem content tests
        run: node tests/filesystem-content.mjs
      - name: Localization tests
        run: node tests/i18n.mjs
      - name: Sudoku logic tests
        run: node tests/sudoku.mjs
      - name: Excel data tests
        run: node tests/excel-data.mjs
      - name: Check JavaScript syntax
        shell: bash
        run: |
          find . -name '*.js' -print0 | xargs -0 -n1 node --check
